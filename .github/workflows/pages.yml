name: CI & Deploy Demo (GitHub Pages)

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & API tests
        run: npm test
      - name: Build static demo (in-browser PMS engine)
        run: npm run build:pages
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }} from ${{ github.ref_name }}'
      - name: Ensure GitHub Pages is enabled (gh-pages branch)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled"; gh api "repos/${{ github.repository }}/pages" --jq '.html_url, .source'
          else
            gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
              && echo "Pages enabled" \
              || echo "::warning::Could not enable Pages automatically. Enable it once in Settings → Pages → Deploy from branch gh-pages / (root)."
          fi
      - name: Check live URL
        continue-on-error: true
        run: |
          sleep 45
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/")
          echo "Live URL status: $code"
