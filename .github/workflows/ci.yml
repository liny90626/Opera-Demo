name: CI

# GitHub Pages deployment was removed; this workflow only typechecks and tests.
# To bring the online demo back, restore the build/publish steps from git history.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & API tests
        run: npm test
